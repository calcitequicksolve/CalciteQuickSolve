services:
  cqs:
    image: slyke/calcitequicksolve-server:1.0.1
    restart: unless-stopped
    env_file: ./server.env
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./config.json5:/config/config.json5:ro
      - cqs-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  cqs-data:
