services:
  cqs:
    image: slyke/calcitequicksolve-server:v1.0.2@sha256:570990855efb07d3ef88ea271cfffc6a05a38aa75fa787c99d357cc28b56acf3
    restart: unless-stopped
    env_file: ./server.env
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./config.json5:/config/config.json5:ro
      - cqs-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  cqs-data:
